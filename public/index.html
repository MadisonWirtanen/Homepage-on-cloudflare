<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="知无涯者 · 个人服务与资源导航" />
    <title>知无涯者</title>
    <link rel="icon" href="https://cdn.003153.xyz/%E7%9F%A5%E6%97%A0%E6%B6%AF%E8%80%85.png" />
    <link rel="preconnect" href="https://cdn.003153.xyz" crossorigin />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="background" aria-hidden="true"></div>
    <div class="background-shade" aria-hidden="true"></div>

    <main class="page-shell">
      <header class="hero glass-panel">
        <div class="brand">
          <img id="brand-logo" class="brand-logo" alt="知无涯者" />
          <div>
            <h1 id="page-title">知无涯者</h1>
            <p class="brand-subtitle">Homepage on Cloudflare</p>
          </div>
        </div>

        <div class="hero-widgets">
          <div class="widget-block" id="weather-widget" aria-live="polite">
            <span class="widget-label">天气</span>
            <strong id="weather-value">--</strong>
            <span id="weather-extra">杭州</span>
          </div>
          <div class="widget-block">
            <span class="widget-label">日期</span>
            <strong id="date-value">--</strong>
            <span id="weekday-value">--</span>
          </div>
          <div class="widget-block">
            <span class="widget-label">时间</span>
            <strong id="time-value">--:--:--</strong>
            <span>本地时间</span>
          </div>
        </div>
      </header>

      <form id="search-form" class="search glass-panel" role="search">
        <select id="search-provider" aria-label="搜索引擎"></select>
        <input id="search-input" type="search" autocomplete="off" placeholder="搜索…" aria-label="搜索内容" />
        <button type="submit">搜索</button>
      </form>

      <section class="section" aria-labelledby="status-heading">
        <div class="section-heading">
          <div>
            <span class="eyebrow">STATUS</span>
            <h2 id="status-heading">运行状态</h2>
          </div>
          <div class="status-actions">
            <span id="status-updated" class="muted">尚未检查</span>
            <button id="refresh-status" class="ghost-button" type="button">刷新状态</button>
          </div>
        </div>
        <div id="status-grid" class="card-grid status-grid"></div>
      </section>

      <div id="groups-root"></div>

      <footer>
        <span>Cloudflare Static Assets + Worker API</span>
        <span class="footer-dot">·</span>
        <a href="https://github.com/MadisonWirtanen/Homepage-on-cloudflare" target="_blank" rel="noopener noreferrer">Source</a>
      </footer>
    </main>

    <noscript>此页面需要 JavaScript 才能显示导航卡片与状态信息。</noscript>
    <script type="module" src="/app.js"></script>
  </body>
</html>
