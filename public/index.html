<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="知无涯者 · 个人服务与资源导航" />
    <title>知无涯者</title>
    <link rel="icon" href="https://cdn.003153.xyz/%E7%9F%A5%E6%97%A0%E6%B6%AF%E8%80%85.png" />
    <link rel="preconnect" href="https://cdn.003153.xyz" crossorigin />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <svg class="liquid-glass-defs" aria-hidden="true" focusable="false">
      <defs>
        <filter id="lg-refraction-pill" x="-12%" y="-45%" width="124%" height="190%" color-interpolation-filters="sRGB">
          <feImage id="lg-map-pill" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" result="map" />
          <feDisplacementMap in="SourceGraphic" in2="map" scale="-32" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="lg-refraction-card" x="-16%" y="-38%" width="132%" height="176%" color-interpolation-filters="sRGB">
          <feImage id="lg-map-card" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" result="map" />
          <feDisplacementMap in="SourceGraphic" in2="map" scale="-26" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="lg-refraction-control" x="-18%" y="-40%" width="136%" height="180%" color-interpolation-filters="sRGB">
          <feImage id="lg-map-control" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" result="map" />
          <feDisplacementMap in="SourceGraphic" in2="map" scale="-22" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>

    <div class="background" aria-hidden="true"></div>

    <main class="page-shell">
      <header class="topbar">
        <div class="brand">
          <img id="brand-logo" class="brand-logo" alt="知无涯者" />
          <h1 id="page-title">知无涯者</h1>
        </div>

        <div class="top-widgets">
          <div class="widget-block" id="weather-widget" aria-live="polite">
            <strong id="weather-value">--</strong>
            <span id="weather-extra">杭州</span>
          </div>
          <div class="widget-block">
            <strong id="date-value">--</strong>
            <span id="weekday-value">--</span>
          </div>
          <div class="widget-block">
            <strong id="time-value">--:--:--</strong>
            <span>本地时间</span>
          </div>
        </div>
      </header>

      <form id="search-form" class="search-shell" role="search">
        <div id="search-providers" class="search-providers" aria-label="搜索引擎"></div>
        <div class="search-input-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m21 21-4.35-4.35m1.35-5.65a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"></path>
          </svg>
          <input id="search-input" type="search" autocomplete="off" placeholder="搜索…" aria-label="搜索内容" />
        </div>
        <button class="search-submit" type="submit" aria-label="搜索">搜索</button>
      </form>

      <div id="primary-root" class="primary-root"></div>
      <div id="groups-root"></div>
    </main>

    <div id="glass-tuner" class="glass-tuner">
      <button id="glass-tuner-toggle" class="glass-tuner-toggle" type="button" aria-expanded="false" aria-controls="glass-tuner-panel">
        <span class="glass-tuner-dot" aria-hidden="true"></span>
        <span>玻璃</span>
        <strong id="glass-tuner-value">64%</strong>
      </button>
      <div id="glass-tuner-panel" class="glass-tuner-panel" hidden>
        <div class="glass-tuner-heading">
          <span>玻璃透明度</span>
          <strong id="glass-tuner-panel-value">64%</strong>
        </div>
        <input id="glass-transparency" type="range" min="35" max="82" step="1" value="64" aria-label="玻璃透明度" />
        <div class="glass-tuner-scale">
          <span>更实</span>
          <span>更透</span>
        </div>
        <button id="glass-tuner-reset" class="glass-tuner-reset" type="button">恢复默认</button>
      </div>
    </div>

    <noscript>此页面需要 JavaScript 才能显示导航卡片与状态信息。</noscript>
    <script type="module" src="/app.js"></script>
  </body>
</html>
