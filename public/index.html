<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="知无涯者 · 个人服务与资源导航" />
    <title>知无涯者</title>
    <link rel="icon" href="https://cdn.003153.xyz/%E7%9F%A5%E6%97%A0%E6%B6%AF%E8%80%85.png" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="background" aria-hidden="true"></div>

    <main class="page-shell">
      <header class="topbar">
        <div class="top-widgets">
          <div class="widget-block" id="weather-widget" aria-live="polite">
            <strong id="weather-value">--</strong>
            <span id="weather-extra">杭州</span>
          </div>
          <div class="widget-block">
            <strong id="date-value">--</strong>
            <span id="weekday-value">--</span>
          </div>
          <div class="widget-block">
            <strong id="time-value">--:--:--</strong>
            <span>本地时间</span>
          </div>
        </div>
      </header>

      <form id="search-form" class="search" role="search">
        <select id="search-provider" aria-label="搜索引擎"></select>
        <input id="search-input" type="search" autocomplete="off" placeholder="搜索…" aria-label="搜索内容" />
        <button type="submit">搜索</button>
      </form>

      <div id="service-columns" class="service-columns">
        <section class="section group-column status-column" aria-labelledby="status-heading">
          <div class="section-heading">
            <div class="section-title-wrap">
              <img class="section-icon" src="/icons/uptime-kuma.svg" alt="" loading="lazy" referrerpolicy="no-referrer" />
              <h2 id="status-heading">Status</h2>
            </div>
            <div class="status-actions">
              <span id="status-updated" class="muted">尚未检查</span>
              <button id="refresh-status" class="ghost-button" type="button">刷新</button>
            </div>
          </div>
          <div id="status-grid" class="card-list"></div>
        </section>
      </div>

      <div id="groups-root"></div>
    </main>

    <noscript>此页面需要 JavaScript 才能显示导航卡片与状态信息。</noscript>
    <script type="module" src="/app.js"></script>
  </body>
</html>
