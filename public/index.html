<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="知无涯者 · 个人服务与资源导航" />
    <title>知无涯者</title>
    <link rel="icon" href="https://cdn.003153.xyz/%E7%9F%A5%E6%97%A0%E6%B6%AF%E8%80%85.png" />
    <link rel="preconnect" href="https://cdn.003153.xyz" crossorigin />
    <script>
      try {
        const savedTheme = localStorage.getItem("homepage-theme-v2");
        document.documentElement.dataset.theme = savedTheme === "light" ? "light" : "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <svg class="liquid-glass-defs" aria-hidden="true" focusable="false">
      <defs>
        <filter id="lg-refraction-pill" x="-12%" y="-45%" width="124%" height="190%" color-interpolation-filters="sRGB">
          <feImage id="lg-map-pill" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" result="map" />
          <feDisplacementMap in="SourceGraphic" in2="map" scale="-32" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="lg-refraction-card" x="-16%" y="-38%" width="132%" height="176%" color-interpolation-filters="sRGB">
          <feImage id="lg-map-card" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" result="map" />
          <feDisplacementMap in="SourceGraphic" in2="map" scale="-26" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="lg-refraction-control" x="-18%" y="-40%" width="136%" height="180%" color-interpolation-filters="sRGB">
          <feImage id="lg-map-control" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" result="map" />
          <feDisplacementMap in="SourceGraphic" in2="map" scale="-22" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>

    <div class="background" aria-hidden="true"></div>

    <main class="page-shell">
      <header class="topbar">
        <div class="brand">
          <img id="brand-logo" class="brand-logo" alt="知无涯者" />
          <h1 id="page-title">知无涯者</h1>
        </div>

        <div class="top-widgets">
          <div class="widget-block" id="weather-widget" aria-live="polite">
            <strong id="weather-value">--</strong>
            <span id="weather-extra">杭州</span>
          </div>
          <div class="widget-block">
            <strong id="date-value">--</strong>
            <span id="weekday-value">--</span>
          </div>
          <div class="widget-block">
            <strong id="time-value">--:--:--</strong>
            <span>本地时间</span>
          </div>
        </div>
      </header>

      <form id="search-form" class="search-shell" role="search">
        <div id="search-providers" class="search-providers" aria-label="搜索引擎">
          <span id="search-selection" class="search-selection" aria-hidden="true"></span>
        </div>
        <div class="search-input-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m21 21-4.35-4.35m1.35-5.65a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"></path>
          </svg>
          <input id="search-input" type="search" autocomplete="off" placeholder="搜索…" aria-label="搜索内容" />
        </div>
        <button class="search-submit" type="submit" aria-label="搜索">搜索</button>
      </form>

      <div id="primary-root" class="primary-root"></div>
      <div id="groups-root"></div>
    </main>

    <div id="side-controls" class="side-controls" aria-label="显示设置">
      <div id="glass-control" class="side-control">
        <button id="glass-tuner-toggle" class="side-control-button glass-tuner-toggle" type="button" aria-expanded="false" aria-controls="glass-tuner-panel" aria-label="液态玻璃设置">
          <svg class="side-control-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2.8c-2.8 4-6.2 7.1-6.2 11.2a6.2 6.2 0 0 0 12.4 0C18.2 9.9 14.8 6.8 12 2.8Z"></path>
            <path d="M9.2 15.2c.5 1.2 1.5 1.9 2.8 2.1"></path>
          </svg>
          <span class="side-control-label">液态玻璃</span>
          <strong id="glass-tuner-value" class="side-control-value">72%</strong>
        </button>
        <div id="glass-tuner-panel" class="glass-tuner-panel" hidden>
          <div class="glass-tuner-heading">
            <span>液态玻璃透明度</span>
            <strong id="glass-tuner-panel-value">72%</strong>
          </div>
          <input id="glass-transparency" type="range" min="35" max="100" step="1" value="72" aria-label="液态玻璃透明度" />
          <div class="glass-tuner-scale">
            <span>更实</span>
            <span>更透</span>
          </div>
          <button id="glass-tuner-reset" class="glass-tuner-reset" type="button">恢复默认</button>
        </div>
      </div>

      <button id="theme-toggle" class="side-control-button theme-toggle" type="button" aria-label="切换浅色主题">
        <svg class="side-control-icon theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3.5"></circle>
          <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"></path>
        </svg>
        <svg class="side-control-icon theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 15.3A8.2 8.2 0 0 1 8.7 4a8.5 8.5 0 1 0 11.3 11.3Z"></path>
        </svg>
        <span id="theme-toggle-label" class="side-control-label">浅色主题</span>
      </button>
    </div>

    <noscript>此页面需要 JavaScript 才能显示导航卡片与状态信息。</noscript>
    <script type="module" src="/app.js"></script>
  </body>
</html>
