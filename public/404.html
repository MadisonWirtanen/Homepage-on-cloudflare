<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>页面不存在 · 知无涯者</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #f3f7fb; background: radial-gradient(circle at 30% 20%, #123c58, #08131d 58%, #050b10); }
      main { width: min(92vw, 520px); padding: 40px; text-align: center; border: 1px solid rgba(255,255,255,.16); border-radius: 24px; background: rgba(8,22,32,.56); backdrop-filter: blur(18px) saturate(140%); box-shadow: 0 24px 70px rgba(0,0,0,.28); }
      strong { display: block; margin-bottom: 8px; font-size: clamp(3rem, 10vw, 5.5rem); letter-spacing: -.06em; }
      h1 { margin: 0 0 10px; font-size: 1.35rem; }
      p { margin: 0 0 24px; color: rgba(235,243,250,.66); }
      a { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 18px; border-radius: 12px; color: #fff; text-decoration: none; background: linear-gradient(145deg, rgba(48,111,151,.92), #003153); box-shadow: inset 0 1px rgba(255,255,255,.22), 0 8px 24px rgba(0,25,43,.28); }
    </style>
  </head>
  <body>
    <main>
      <strong>404</strong>
      <h1>这里没有你要找的页面</h1>
      <p>导航主页仍然正常，可返回首页继续使用。</p>
      <a href="/">返回知无涯者</a>
    </main>
  </body>
</html>
