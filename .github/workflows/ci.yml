name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, secrets, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Verify production homepage
        shell: bash
        run: |
          set -euo pipefail
          URL="https://www.xn--rgvt7o95i1ni.com"

          fetch_code() {
            local path="$1"
            local output="$2"
            curl -sSL --max-time 20 -o "$output" -w '%{http_code}' "$URL$path"
          }

          PAGE_READY=0
          for attempt in {1..36}; do
            ROOT_CODE="$(fetch_code "/" /tmp/root.html || true)"
            APP_CODE="$(fetch_code "/app.js" /tmp/app.js || true)"
            SEARCH_CODE="$(fetch_code "/js/search.js" /tmp/search.js || true)"
            SEARCH_CSS_CODE="$(fetch_code "/styles/search.css" /tmp/search.css || true)"
            CONFIG_CODE="$(fetch_code "/config.js" /tmp/config.js || true)"
            EFFECT_CODE="$(fetch_code "/effects/glass-pill.png" /tmp/glass-pill.png || true)"
            ICON_CODE="$(fetch_code "/icons/uptime-kuma.svg" /tmp/uptime-kuma.svg || true)"
            BRAND_CODE="$(fetch_code "/branding/logo.webp" /tmp/brand-logo.webp || true)"
            FAVICON_CODE="$(fetch_code "/branding/favicon.png" /tmp/favicon.png || true)"
            FONT_CODE="$(fetch_code "/fonts/homepage-title-serif.woff2" /tmp/title-font.woff2 || true)"
            BUILD_CODE="$(fetch_code "/build.json?ci=$GITHUB_SHA&attempt=$attempt" /tmp/build.json || true)"
            FONT_SIZE="$(wc -c < /tmp/title-font.woff2 2>/dev/null | tr -d ' ' || true)"
            HEALTH_CODE="$(fetch_code "/api/health?ci=$GITHUB_SHA&attempt=$attempt" /tmp/health.json || true)"
            NOT_FOUND_CODE="$(fetch_code "/ci-this-page-does-not-exist" /tmp/not-found.html || true)"

            if [ "$ROOT_CODE" = "200" ]               && [ "$APP_CODE" = "200" ]               && [ "$SEARCH_CODE" = "200" ]               && [ "$SEARCH_CSS_CODE" = "200" ]               && [ "$CONFIG_CODE" = "200" ]               && [ "$EFFECT_CODE" = "200" ]               && [ "$ICON_CODE" = "200" ]               && [ "$BRAND_CODE" = "200" ]               && [ "$FAVICON_CODE" = "200" ]               && [ "$FONT_CODE" = "200" ]               && [ "$BUILD_CODE" = "200" ]               && [ "${FONT_SIZE:-0}" -gt 1000 ]               && [ "${FONT_SIZE:-0}" -lt 10000 ]               && jq -e --arg sha "$GITHUB_SHA" '.commit == $sha' /tmp/build.json >/dev/null 2>&1               && [ "$HEALTH_CODE" = "200" ]               && [ "$NOT_FOUND_CODE" = "404" ]               && grep -q '<title>知无涯者</title>' /tmp/root.html               && grep -q 'href="/styles/search.css"' /tmp/root.html               && grep -q 'href="/branding/favicon.png"' /tmp/root.html               && grep -q 'href="/effects/glass-pill.png"' /tmp/root.html               && grep -q 'function beginDrag' /tmp/search.js               && grep -q 'max="100"' /tmp/root.html               && grep -q 'value="72"' /tmp/root.html               && grep -q '页面不存在' /tmp/not-found.html               && jq -e '.ok == true and .runtime == "cloudflare-workers"' /tmp/health.json >/dev/null 2>&1; then
              PAGE_READY=1
              break
            fi
            sleep 5
          done

          if [ "$PAGE_READY" != "1" ]; then
            echo "Production static assets did not become ready."
            exit 1
          fi

          STATUS_READY=0
          for attempt in {1..12}; do
            STATUS_CODE="$(fetch_code "/api/status?ci=$GITHUB_SHA&attempt=$attempt" /tmp/status.json || true)"
            if [ "$STATUS_CODE" = "200" ] && jq -e '
              .providers.cloudflareLinux.configured == true and
              .providers.cloudflareColoCrossing.configured == true and
              .providers.uptimeRobot.configured == true and
              (.sites | not)
            ' /tmp/status.json >/dev/null 2>&1; then
              STATUS_READY=1
              break
            fi
            sleep 5
          done

          if [ "$STATUS_READY" != "1" ]; then
            echo "Production status providers did not become ready."
            cat /tmp/status.json || true
            exit 1
          fi

          WEATHER_READY=0
          for attempt in {1..12}; do
            WEATHER_CODE="$(fetch_code "/api/weather?ci=$GITHUB_SHA&attempt=$attempt" /tmp/weather.json || true)"
            if [ "$WEATHER_CODE" = "200" ] && jq -e '
              (.location.label | type == "string" and length > 0) and
              (.location.source == "ip" or .location.source == "fallback") and
              (.current.temperature_2m | type == "number") and
              (.current.apparent_temperature | type == "number") and
              (.current.weather_code | type == "number")
            ' /tmp/weather.json >/dev/null 2>&1; then
              WEATHER_READY=1
              break
            fi
            sleep 5
          done

          if [ "$WEATHER_READY" != "1" ]; then
            echo "Production weather API did not become ready."
            cat /tmp/weather.json || true
            exit 1
          fi

          jq '{
            location: .location.label,
            source: .location.source,
            temperature: .current.temperature_2m,
            weatherCode: .current.weather_code
          }' /tmp/weather.json

          jq '{
            checkedAt,
            cloudflareLinux: {
              ok: .providers.cloudflareLinux.ok,
              status: .providers.cloudflareLinux.status,
              connections: .providers.cloudflareLinux.connections
            },
            cloudflareColoCrossing: {
              ok: .providers.cloudflareColoCrossing.ok,
              status: .providers.cloudflareColoCrossing.status,
              connections: .providers.cloudflareColoCrossing.connections
            },
            uptimeRobot: {
              ok: .providers.uptimeRobot.ok,
              status: .providers.uptimeRobot.status,
              up: .providers.uptimeRobot.up,
              down: .providers.uptimeRobot.down
            }
          }' /tmp/status.json
