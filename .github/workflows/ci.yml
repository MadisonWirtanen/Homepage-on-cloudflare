name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check

  smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Verify production homepage
        shell: bash
        run: |
          set -euo pipefail
          URL="https://www.xn--rgvt7o95i1ni.com"

          fetch_code() {
            local path="$1"
            local output="$2"
            curl -sSL --max-time 20 -o "$output" -w '%{http_code}' "$URL$path"
          }

          ROOT_CODE="$(fetch_code "/" /tmp/root.html)"
          APP_CODE="$(fetch_code "/app.js" /tmp/app.js)"
          HEALTH_CODE="$(fetch_code "/api/health?ci=$GITHUB_SHA" /tmp/health.json)"

          test "$ROOT_CODE" = "200"
          test "$APP_CODE" = "200"
          test "$HEALTH_CODE" = "200"
          grep -q '<title>知无涯者</title>' /tmp/root.html
          jq -e '.ok == true and .runtime == "cloudflare-workers"' /tmp/health.json >/dev/null

          STATUS_READY=0
          for attempt in {1..12}; do
            STATUS_CODE="$(fetch_code "/api/status?ci=$GITHUB_SHA&attempt=$attempt" /tmp/status.json || true)"
            if [ "$STATUS_CODE" = "200" ] && jq -e '
              .providers.cloudflareTunnel.configured == true and
              .providers.cloudflareTunnel.ok == true and
              .providers.uptimeRobot.configured == true and
              .providers.uptimeRobot.ok == true
            ' /tmp/status.json >/dev/null 2>&1; then
              STATUS_READY=1
              break
            fi
            sleep 5
          done

          if [ "$STATUS_READY" != "1" ]; then
            echo "Production status providers did not become ready."
            cat /tmp/status.json || true
            exit 1
          fi


          jq '{
            checkedAt,
            cloudflareTunnel: {
              ok: .providers.cloudflareTunnel.ok,
              status: .providers.cloudflareTunnel.status,
              connections: .providers.cloudflareTunnel.connections
            },
            uptimeRobot: {
              ok: .providers.uptimeRobot.ok,
              status: .providers.uptimeRobot.status,
              up: .providers.uptimeRobot.up,
              down: .providers.uptimeRobot.down
            },
            sites: (.sites | with_entries(.value = {
              online: .value.online,
              status: .value.status,
              latency: .value.latency
            }))
          }' /tmp/status.json
