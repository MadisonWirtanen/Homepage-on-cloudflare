name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check

  smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Verify production homepage
        shell: bash
        run: |
          set -euo pipefail
          URL="https://www.xn--rgvt7o95i1ni.com"

          fetch_code() {
            local path="$1"
            local output="$2"
            curl -sSL --max-time 20 -o "$output" -w '%{http_code}' "$URL$path"
          }

          PAGE_READY=0
          for attempt in {1..12}; do
            ROOT_CODE="$(fetch_code "/" /tmp/root.html || true)"
            APP_CODE="$(fetch_code "/app.js" /tmp/app.js || true)"
            CONFIG_CODE="$(fetch_code "/config.js" /tmp/config.js || true)"
            ICON_CODE="$(fetch_code "/icons/uptime-kuma.svg" /tmp/uptime-kuma.svg || true)"
            HEALTH_CODE="$(fetch_code "/api/health?ci=$GITHUB_SHA&attempt=$attempt" /tmp/health.json || true)"

            if [ "$ROOT_CODE" = "200" ] \
              && [ "$APP_CODE" = "200" ] \
              && [ "$CONFIG_CODE" = "200" ] \
              && [ "$ICON_CODE" = "200" ] \
              && [ "$HEALTH_CODE" = "200" ] \
              && grep -q '<title>知无涯者</title>' /tmp/root.html \
              && grep -q 'id="page-title">知无涯者</h1>' /tmp/root.html \
              && grep -q 'https://img.003153.xyz/index.php' /tmp/config.js \
              && grep -q 'https://cdn.003153.xyz/%E7%9F%A5%E6%97%A0%E6%B6%AF%E8%80%85.png' /tmp/config.js \
              && jq -e '.ok == true and .runtime == "cloudflare-workers"' /tmp/health.json >/dev/null 2>&1; then
              PAGE_READY=1
              break
            fi
            sleep 5
          done

          if [ "$PAGE_READY" != "1" ]; then
            echo "Production static assets did not become ready."
            exit 1
          fi

          STATUS_READY=0
          for attempt in {1..12}; do
            STATUS_CODE="$(fetch_code "/api/status?ci=$GITHUB_SHA&attempt=$attempt" /tmp/status.json || true)"
            if [ "$STATUS_CODE" = "200" ] && jq -e '
              .providers.cloudflareTunnel.configured == true and
              .providers.cloudflareTunnel.ok == true and
              .providers.uptimeRobot.configured == true and
              .providers.uptimeRobot.ok == true and
              (.sites | not)
            ' /tmp/status.json >/dev/null 2>&1; then
              STATUS_READY=1
              break
            fi
            sleep 5
          done

          if [ "$STATUS_READY" != "1" ]; then
            echo "Production status providers did not become ready."
            cat /tmp/status.json || true
            exit 1
          fi

          jq '{
            checkedAt,
            cloudflareTunnel: {
              ok: .providers.cloudflareTunnel.ok,
              status: .providers.cloudflareTunnel.status,
              connections: .providers.cloudflareTunnel.connections
            },
            uptimeRobot: {
              ok: .providers.uptimeRobot.ok,
              status: .providers.uptimeRobot.status,
              up: .providers.uptimeRobot.up,
              down: .providers.uptimeRobot.down
            }
          }' /tmp/status.json
