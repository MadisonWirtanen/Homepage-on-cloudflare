name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check

  smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Verify production homepage
        shell: bash
        run: |
          set -u
          URL="https://homepage-on-cloudflare.madisonwirtanen.workers.dev"

          probe() {
            name="$1"
            path="$2"
            echo "===== $name $path ====="
            code="$(curl -sS --max-time 20 -D "/tmp/$name.headers" -o "/tmp/$name.body" -w '%{http_code}' "$URL$path" || true)"
            echo "HTTP $code"
            cat "/tmp/$name.headers" || true
            echo "--- body ---"
            head -c 3000 "/tmp/$name.body" || true
            echo
            echo
          }

          probe root "/"
          probe index "/index.html"
          probe appjs "/app.js"
          probe health "/api/health"
          probe status "/api/status"

          ROOT_CODE="$(awk 'NR==1 {print $2}' /tmp/root.headers)"
          INDEX_CODE="$(awk 'NR==1 {print $2}' /tmp/index.headers)"
          APP_CODE="$(awk 'NR==1 {print $2}' /tmp/appjs.headers)"
          HEALTH_CODE="$(awk 'NR==1 {print $2}' /tmp/health.headers)"
          STATUS_CODE="$(awk 'NR==1 {print $2}' /tmp/status.headers)"

          test "$ROOT_CODE" = "200"
          test "$INDEX_CODE" = "200"
          test "$APP_CODE" = "200"
          test "$HEALTH_CODE" = "200"
          test "$STATUS_CODE" = "200"

          grep -q '<title>知无涯者</title>' /tmp/root.body

          jq -e '
            .providers.tailscale.configured == true and
            .providers.tailscale.ok == true and
            .providers.cloudflareTunnel.configured == true and
            .providers.cloudflareTunnel.ok == true and
            .providers.uptimeRobot.configured == true and
            .providers.uptimeRobot.ok == true
          ' /tmp/status.body >/dev/null

          jq '{
            checkedAt,
            tailscale: .providers.tailscale.status,
            cloudflareTunnel: .providers.cloudflareTunnel.status,
            uptimeRobot: .providers.uptimeRobot.status,
            sites: (.sites | with_entries(.value = {
              online: .value.online,
              status: .value.status,
              latency: .value.latency
            }))
          }' /tmp/status.body
