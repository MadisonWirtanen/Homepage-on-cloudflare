name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check

  smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Verify production homepage
        shell: bash
        run: |
          set -u
          URL="https://homepage-test.xn--rgvt7o95i1ni.com"
          DIAG_URL="https://workerdiag.xn--rgvt7o95i1ni.com"
          echo "===== account-level workers.dev diagnostic ====="
          curl -fsS --max-time 15 "$DIAG_URL/" | grep -q "OK-DIAGNOSTIC"
          echo "Diagnostic Worker reachable"


          probe() {
            name="$1"
            path="$2"
            echo "===== $name $path ====="
            code="$(curl -sSL --max-time 20 -D "/tmp/$name.headers" -o "/tmp/$name.body" -w '%{http_code}' "$URL$path" || true)"
            echo "HTTP $code"
            cat "/tmp/$name.headers" || true
            echo "--- body ---"
            head -c 3000 "/tmp/$name.body" || true
            echo
            echo
          }

          probe root "/"
          probe index "/index.html"
          probe appjs "/app.js"
          probe health "/api/health"
          probe status "/api/status"

                    ROOT_CODE="$(grep '^HTTP/' /tmp/root.headers | tail -n1 | cut -d' ' -f2)"
                    INDEX_CODE="$(grep '^HTTP/' /tmp/index.headers | tail -n1 | cut -d' ' -f2)"
                    APP_CODE="$(grep '^HTTP/' /tmp/appjs.headers | tail -n1 | cut -d' ' -f2)"
                    HEALTH_CODE="$(grep '^HTTP/' /tmp/health.headers | tail -n1 | cut -d' ' -f2)"
                    STATUS_CODE="$(grep '^HTTP/' /tmp/status.headers | tail -n1 | cut -d' ' -f2)"

          test "$ROOT_CODE" = "200"
          test "$INDEX_CODE" = "200"
          test "$APP_CODE" = "200"
          test "$HEALTH_CODE" = "200"
          test "$STATUS_CODE" = "200"

          grep -q '<title>知无涯者</title>' /tmp/root.body

          jq '{
            checkedAt,
            tailscale: .providers.tailscale.status,
            cloudflareTunnel: .providers.cloudflareTunnel.status,
            uptimeRobot: .providers.uptimeRobot.status,
            sites: (.sites | with_entries(.value = {
              online: .value.online,
              status: .value.status,
              latency: .value.latency
            }))
          }' /tmp/status.body
